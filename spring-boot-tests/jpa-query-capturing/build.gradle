plugins {
	id "java-library"
}

dependencies {
	implementation platform("org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}")
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	runtimeOnly "com.h2database:h2"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation(project(":")) {
		capabilities {
			requireCapability("de.cronn:test-utils-jpa-query-capturing-support")
		}
	}
	testImplementation(project(":")) {
		capabilities {
			requireCapability("de.cronn:test-utils-h2-support")
		}
	}

	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	inputs.dir("data/test/validation")
	outputs.dir("data/test/output")
	outputs.dir("data/test/tmp")
}
